[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentronix-shared"
version = "1.0.0"
description = "Shared utilities for Sentronix microservices"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "fastapi",
    "pydantic",
]

[tool.setuptools]
packages = ["shared"]
